<svg viewBox="0 0 760 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Git working tree, staging area, local repository, and remote, with the commands that move changes between them">
  <defs>
    <marker id="ga-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="ga-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
  </defs>
  <!-- group brackets -->
  <path d="M20 22V14H546V22" fill="none" stroke="#5c4a30" stroke-width="1.5"/>
  <text x="283" y="10" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.6" fill="#5c4a30">YOUR COMPUTER</text>
  <path d="M584 22V14H740V22" fill="none" stroke="#5c4a30" stroke-width="1.5"/>
  <text x="662" y="10" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.6" fill="#5c4a30">HOSTED SERVER</text>
  <!-- boxes -->
  <g font-weight="800" text-anchor="middle">
    <rect x="23" y="70" width="156" height="58" rx="8" fill="#1a1209"/><rect x="20" y="67" width="156" height="58" rx="8" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="98" y="92" font-size="14" fill="#1a1209">Working tree</text>
    <text x="98" y="110" font-size="10" font-weight="600" fill="#5c4a30">files you edit</text>
    <rect x="208" y="70" width="156" height="58" rx="8" fill="#1a1209"/><rect x="205" y="67" width="156" height="58" rx="8" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
    <text x="283" y="92" font-size="14" fill="#1a1209">Staging area</text>
    <text x="283" y="110" font-size="10" font-weight="600" fill="#5c4a30">the index: next commit</text>
    <rect x="393" y="70" width="156" height="58" rx="8" fill="#1a1209"/><rect x="390" y="67" width="156" height="58" rx="8" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <text x="468" y="92" font-size="14" fill="#1a1209">Local repository</text>
    <text x="468" y="110" font-size="10" font-weight="600" fill="#5c4a30">.git: committed history</text>
    <rect x="587" y="70" width="156" height="58" rx="8" fill="#1a1209"/><rect x="584" y="67" width="156" height="58" rx="8" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
    <text x="662" y="92" font-size="14" fill="#fff">Remote (origin)</text>
    <text x="662" y="110" font-size="10" font-weight="600" fill="#efe6ff">GitHub, GitLab, Gitea</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#ga-ink)">
    <path d="M150 62C170 38 196 38 216 60"/>
    <path d="M335 62C355 38 381 38 401 60"/>
    <path d="M520 62C540 38 576 38 596 60"/>
  </g>
  <g class="mono" font-size="12" font-weight="600" fill="#1a1209" text-anchor="middle">
    <text x="183" y="40">git add</text>
    <text x="368" y="40">git commit</text>
    <text x="558" y="40">git push</text>
  </g>
  <!-- backward arrows -->
  <g stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ga-pur)">
    <path d="M620 133C600 156 552 156 532 136"/>
    <path d="M420 133C380 158 140 158 100 136"/>
    <path d="M700 133C680 200 120 200 60 136"/>
  </g>
  <g class="mono" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle">
    <text x="576" y="166">git fetch</text>
    <text x="260" y="168">git switch / git restore</text>
    <text x="380" y="208">git pull  (fetch + merge into your branch)</text>
  </g>
</svg>
