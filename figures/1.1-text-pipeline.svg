  <text class="mono" x="62.0" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1209">auth.log</text>
  <text x="62.0" y="61" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">input file</text>
