  <text x="697.0" y="61" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">then head -3</text>
  <path d="M649 69H745" stroke="#d8d2c8" stroke-width="1.5"/>
  <text class="mono" x="650" y="85" font-size="8.5" font-weight="500" fill="#1a1209">4 203.0.113.9</text>
