  <text x="570.0" y="16" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1.3" fill="#5c4a30">3 LINES</text>
  <rect x="516.5" y="30.5" width="112" height="142" rx="7" fill="#1a1209"/><rect x="514" y="28" width="112" height="142" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
  <text class="mono" x="570.0" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1209">uniq -c</text>
  <text x="570.0" y="61" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">counts neighbors</text>
  <path d="M522 69H618" stroke="#d8d2c8" stroke-width="1.5"/>
  <text class="mono" x="523" y="85" font-size="8.5" font-weight="500" fill="#1a1209">1 10.0.4.17</text>
