<svg viewBox="0 0 760 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The layers an API call passes through in order, from DNS to TCP, proxy, TLS, HTTP, and the application, with the symptom each layer produces when it fails and the command that checks it">
  <defs>
    <marker id="fl-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
  </defs>
  <text x="4" y="12" font-size="10" font-weight="800" letter-spacing="1.6" fill="#5c4a30">A CALL CLEARS EACH LAYER IN ORDER. FIX THE FIRST ONE THAT FAILS.</text>
  <g font-size="10" text-anchor="middle">
    <!-- 6 columns: x = 4 + i*128, width 112 -->
    <g>
      <rect x="6.5" y="24.5" width="112" height="204" rx="7" fill="#1a1209"/>
      <rect x="4" y="22" width="112" height="204" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
      <path d="M11 23H109a6 6 0 0 1 6 6V52H5V29a6 6 0 0 1 6-6z" fill="#6d28d9"/>
      <text x="60" y="42" font-size="13" font-weight="800" fill="#fff">1. DNS</text>
      <text x="60" y="70" font-weight="600" fill="#5c4a30">name to address</text>
      <text x="60" y="100" font-weight="800" fill="#9a3412" class="mono">curl: (6)</text>
      <text x="60" y="114" fill="#1a1209">could not resolve</text>
      <text x="60" y="128" fill="#1a1209">no such host</text>
      <path d="M14 150H106" stroke="#d8d2c8" stroke-width="1.5"/>
      <text x="60" y="172" class="mono" fill="#1a1209">getent hosts</text>
      <text x="60" y="188" class="mono" fill="#1a1209">dig, nslookup</text>
      <text x="60" y="204" class="mono" fill="#1a1209">/etc/hosts</text>
    </g>
    <g>
      <rect x="134.5" y="24.5" width="112" height="204" rx="7" fill="#1a1209"/>
      <rect x="132" y="22" width="112" height="204" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
      <path d="M139 23H237a6 6 0 0 1 6 6V52H133V29a6 6 0 0 1 6-6z" fill="#6d28d9"/>
      <text x="188" y="42" font-size="13" font-weight="800" fill="#fff">2. TCP</text>
      <text x="188" y="70" font-weight="600" fill="#5c4a30">connect to port</text>
      <text x="188" y="100" font-weight="800" fill="#9a3412" class="mono">curl: (7)  (28)</text>
      <text x="188" y="114" fill="#1a1209">refused: nothing</text>
      <text x="188" y="128" fill="#1a1209">listening; timeout:</text>
      <text x="188" y="142" fill="#1a1209">firewall or hung</text>
      <path d="M142 150H234" stroke="#d8d2c8" stroke-width="1.5"/>
      <text x="188" y="172" class="mono" fill="#1a1209">ss -tlnp</text>
      <text x="188" y="188" class="mono" fill="#1a1209">nc -zv host port</text>
      <text x="188" y="204" class="mono" fill="#1a1209">firewall rules</text>
    </g>
    <g>
      <rect x="262.5" y="24.5" width="112" height="204" rx="7" fill="#1a1209"/>
      <rect x="260" y="22" width="112" height="204" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
      <path d="M267 23H365a6 6 0 0 1 6 6V52H261V29a6 6 0 0 1 6-6z" fill="#6d28d9"/>
      <text x="316" y="42" font-size="13" font-weight="800" fill="#fff">3. Proxy</text>
      <text x="316" y="70" font-weight="600" fill="#5c4a30">egress path</text>
      <text x="316" y="100" font-weight="800" fill="#9a3412" class="mono">curl: (56)</text>
      <text x="316" y="114" fill="#1a1209">407 from proxy,</text>
      <text x="316" y="128" fill="#1a1209">or internal host</text>
      <text x="316" y="142" fill="#1a1209">sent via proxy</text>
      <path d="M270 150H362" stroke="#d8d2c8" stroke-width="1.5"/>
      <text x="316" y="172" class="mono" fill="#1a1209">https_proxy</text>
      <text x="316" y="188" class="mono" fill="#1a1209">no_proxy</text>
      <text x="316" y="204" class="mono" fill="#1a1209">curl -v</text>
    </g>
    <g>
      <rect x="390.5" y="24.5" width="112" height="204" rx="7" fill="#1a1209"/>
      <rect x="388" y="22" width="112" height="204" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
      <path d="M395 23H493a6 6 0 0 1 6 6V52H389V29a6 6 0 0 1 6-6z" fill="#6d28d9"/>
      <text x="444" y="42" font-size="13" font-weight="800" fill="#fff">4. TLS</text>
      <text x="444" y="70" font-weight="600" fill="#5c4a30">trust the cert</text>
      <text x="444" y="100" font-weight="800" fill="#9a3412" class="mono">curl: (60)</text>
      <text x="444" y="114" fill="#1a1209">expired, wrong</text>
      <text x="444" y="128" fill="#1a1209">name, unknown CA,</text>
      <text x="444" y="142" fill="#1a1209">missing chain</text>
      <path d="M398 150H490" stroke="#d8d2c8" stroke-width="1.5"/>
      <text x="444" y="172" class="mono" fill="#1a1209">openssl s_client</text>
      <text x="444" y="188" class="mono" fill="#1a1209">openssl x509</text>
      <text x="444" y="204" class="mono" fill="#1a1209">openssl verify</text>
    </g>
    <g>
      <rect x="518.5" y="24.5" width="112" height="204" rx="7" fill="#1a1209"/>
      <rect x="516" y="22" width="112" height="204" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
      <path d="M523 23H621a6 6 0 0 1 6 6V52H517V29a6 6 0 0 1 6-6z" fill="#6d28d9"/>
      <text x="572" y="42" font-size="13" font-weight="800" fill="#fff">5. HTTP</text>
      <text x="572" y="70" font-weight="600" fill="#5c4a30">auth and limits</text>
      <text x="572" y="100" font-weight="800" fill="#9a3412" class="mono">401 403 429</text>
      <text x="572" y="114" fill="#1a1209">bad token, no</text>
      <text x="572" y="128" fill="#1a1209">permission, too</text>
      <text x="572" y="142" fill="#1a1209">many requests</text>
      <path d="M526 150H618" stroke="#d8d2c8" stroke-width="1.5"/>
      <text x="572" y="172" class="mono" fill="#1a1209">curl -i</text>
      <text x="572" y="188" class="mono" fill="#1a1209">WWW-Authenticate</text>
      <text x="572" y="204" class="mono" fill="#1a1209">Retry-After</text>
    </g>
    <g>
      <rect x="646.5" y="24.5" width="112" height="204" rx="7" fill="#1a1209"/>
      <rect x="644" y="22" width="112" height="204" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
      <path d="M651 23H749a6 6 0 0 1 6 6V52H645V29a6 6 0 0 1 6-6z" fill="#3a1d70"/>
      <text x="700" y="42" font-size="13" font-weight="800" fill="#fff">6. App</text>
      <text x="700" y="70" font-weight="600" fill="#5c4a30">service + config</text>
      <text x="700" y="100" font-weight="800" fill="#9a3412" class="mono">500 502 503 504</text>
      <text x="700" y="114" fill="#1a1209">crashed, stopped,</text>
      <text x="700" y="128" fill="#1a1209">overloaded, or</text>
      <text x="700" y="142" fill="#1a1209">bad config file</text>
      <path d="M654 150H746" stroke="#d8d2c8" stroke-width="1.5"/>
      <text x="700" y="172" class="mono" fill="#1a1209">systemctl status</text>
      <text x="700" y="188" class="mono" fill="#1a1209">journalctl -u</text>
      <text x="700" y="204" class="mono" fill="#1a1209">docker logs</text>
    </g>
  </g>
  <!-- arrows between columns -->
  <g stroke="#1a1209" stroke-width="2" marker-end="url(#fl-ink)">
    <path d="M118 37H130"/><path d="M246 37H258"/><path d="M374 37H386"/><path d="M502 37H514"/><path d="M630 37H642"/>
  </g>
</svg>
