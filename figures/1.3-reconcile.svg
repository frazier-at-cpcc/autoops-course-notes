<svg viewBox="0 0 360 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A declarative tool compares desired state with actual state and changes only the difference; when nothing differs it does nothing">
  <defs>
    <marker id="rc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
  </defs>
  <g text-anchor="middle" font-weight="800">
    <rect x="13" y="13" width="156" height="52" rx="7" fill="#1a1209"/><rect x="10" y="10" width="156" height="52" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <text x="88" y="32" font-size="13" fill="#1a1209">Desired state</text>
    <text x="88" y="50" font-size="10" font-weight="600" fill="#5c4a30">the code in Git</text>

    <rect x="197" y="13" width="156" height="52" rx="7" fill="#1a1209"/><rect x="194" y="10" width="156" height="52" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="272" y="32" font-size="13" fill="#1a1209">Actual state</text>
    <text x="272" y="50" font-size="10" font-weight="600" fill="#5c4a30">what is running now</text>

    <rect x="83" y="99" width="200" height="50" rx="7" fill="#1a1209"/><rect x="80" y="96" width="200" height="50" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
    <text x="180" y="117" font-size="13" fill="#fff">Compare</text>
    <text x="180" y="135" font-size="10" font-weight="600" class="mono" fill="#efe6ff">terraform plan / --check</text>

    <rect x="13" y="185" width="156" height="66" rx="7" fill="#1a1209"/><rect x="10" y="182" width="156" height="66" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
    <text x="88" y="203" font-size="13" fill="#1a1209">Different</text>
    <text x="88" y="220" font-size="10" font-weight="600" fill="#1a1209">change only the gap</text>
    <text x="88" y="238" font-size="10" font-weight="600" class="mono" fill="#1a1209">changed=1</text>

    <rect x="197" y="185" width="156" height="66" rx="7" fill="#1a1209"/><rect x="194" y="182" width="156" height="66" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
    <text x="272" y="203" font-size="13" fill="#1a1209">Already matches</text>
    <text x="272" y="220" font-size="10" font-weight="600" fill="#5c4a30">do nothing</text>
    <text x="272" y="238" font-size="10" font-weight="600" class="mono" fill="#1a1209">changed=0</text>
  </g>
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#rc-ink)">
    <path d="M88 64V80C88 86 104 90 120 93"/>
    <path d="M272 64V80C272 86 256 90 240 93"/>
    <path d="M140 148L100 178"/>
    <path d="M220 148L260 178"/>
  </g>
</svg>
