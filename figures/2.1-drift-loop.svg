<svg viewBox="0 0 760 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terraform plan compares code with refreshed state and real infrastructure, exits 0, 2, or 1, and drift is remediated by apply, by editing code, or by a refresh-only apply">
<defs><marker id="dl-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
<marker id="dl-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker></defs>
<!-- inputs -->
<g text-anchor="middle">
<rect x="18.5" y="20.5" width="164" height="56" rx="7" fill="#1a1209"/><rect x="16" y="18" width="164" height="56" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="98" y="42" font-size="13" font-weight="800" fill="#1a1209">Code</text>
<text x="98" y="59" font-size="9.5" font-weight="600" fill="#5c4a30">.tf files: the desired state</text>
<rect x="18.5" y="100.5" width="164" height="56" rx="7" fill="#1a1209"/><rect x="16" y="98" width="164" height="56" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="98" y="122" font-size="13" font-weight="800" fill="#1a1209">State</text>
<text x="98" y="139" font-size="9.5" font-weight="600" fill="#5c4a30">terraform.tfstate: last known</text>
<rect x="18.5" y="180.5" width="164" height="56" rx="7" fill="#1a1209"/><rect x="16" y="178" width="164" height="56" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="98" y="202" font-size="13" font-weight="800" fill="#1a1209">Real infrastructure</text>
<text x="98" y="219" font-size="9.5" font-weight="600" fill="#5c4a30">what is running right now</text>
<!-- plan -->
<rect x="220.5" y="100.5" width="146" height="56" rx="7" fill="#1a1209"/><rect x="218" y="98" width="146" height="56" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="291" y="121" font-size="12" font-weight="800" fill="#1a1209" class="mono">terraform plan</text>
<text x="291" y="139" font-size="9.5" font-weight="700" fill="#1a1209">refresh, then compare</text>
<!-- exit codes -->
<rect x="406.5" y="28.5" width="116" height="40" rx="7" fill="#1a1209"/><rect x="404" y="26" width="116" height="40" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="462" y="43" font-size="11" font-weight="800" fill="#1a1209" class="mono">exit 0</text>
<text x="462" y="57" font-size="9.5" font-weight="600" fill="#5c4a30">no changes</text>
<rect x="406.5" y="108.5" width="116" height="40" rx="7" fill="#1a1209"/><rect x="404" y="106" width="116" height="40" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="462" y="123" font-size="11" font-weight="800" fill="#fff" class="mono">exit 2</text>
<text x="462" y="137" font-size="9.5" font-weight="700" fill="#efe6ff">changes: drift found</text>
<rect x="406.5" y="188.5" width="116" height="40" rx="7" fill="#1a1209"/><rect x="404" y="186" width="116" height="40" rx="7" fill="#fff" stroke="#9a3412" stroke-width="2"/>
<text x="462" y="203" font-size="11" font-weight="800" fill="#9a3412" class="mono">exit 1</text>
<text x="462" y="217" font-size="9.5" font-weight="600" fill="#5c4a30">error: fix the run</text>
</g>
<!-- arrows into plan -->
<g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#dl-ink)">
<path d="M182 46C202 46 196 114 216 114"/>
<path d="M182 126H216"/>
<path d="M182 206C202 206 196 138 216 138"/>
<path d="M366 120C384 120 384 46 402 46"/>
<path d="M366 126H402"/>
<path d="M366 132C384 132 384 206 402 206"/>
</g>
<path d="M522 126H558" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#dl-pur)"/>
<!-- remediation -->
<rect x="562.5" y="20.5" width="182" height="214" rx="7" fill="#1a1209"/><rect x="560" y="18" width="182" height="214" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="651" y="38" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.6" fill="#5c4a30">REMEDIATE</text>
<g font-size="9.5" font-weight="600" fill="#5c4a30">
<text x="574" y="64" font-size="11" font-weight="800" fill="#6d28d9" class="mono">terraform apply</text>
<text x="574" y="79">The code wins. The real</text>
<text x="574" y="92">infrastructure changes.</text>
<path d="M572 106H730" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="574" y="126" font-size="11" font-weight="800" fill="#6d28d9">Edit code, then apply</text>
<text x="574" y="141">The change wins. The code</text>
<text x="574" y="154">changes; the plan goes clean.</text>
<path d="M572 168H730" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="574" y="188" font-size="11" font-weight="800" fill="#6d28d9" class="mono">apply -refresh-only</text>
<text x="574" y="203">Accept it as is. Only the</text>
<text x="574" y="216">state file changes.</text>
</g>
</svg>
