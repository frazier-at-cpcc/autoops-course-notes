<svg viewBox="0 0 760 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Checking out a tag detaches HEAD; a commit made there has no branch until git branch gives it one">
  <defs>
    <marker id="dh-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="dh-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
  </defs>

  <!-- history on main -->
  <path d="M84 84H296" stroke="#1a1209" stroke-width="2.5"/>
  <path d="M80 96L180 154" stroke="#9a3412" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g stroke="#1a1209" stroke-width="2">
    <circle cx="70" cy="84" r="14" fill="#efe6ff"/>
    <circle cx="190" cy="84" r="14" fill="#efe6ff"/>
    <circle cx="310" cy="84" r="14" fill="#efe6ff"/>
    <circle cx="190" cy="164" r="14" fill="#ffd60a"/>
  </g>
  <g class="mono" font-size="10" font-weight="600" fill="#5c4a30" text-anchor="middle">
    <text x="62" y="118">309f3f2</text>
    <text x="190" y="196" fill="#1a1209">bc51973</text>
  </g>

  <!-- tag and branch labels -->
  <g font-weight="800" text-anchor="middle">
    <rect x="37" y="21" width="66" height="24" rx="6" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
    <text x="70" y="37" font-size="11" class="mono" fill="#1a1209">v1.0.0</text>
    <rect x="283" y="21" width="54" height="24" rx="6" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="310" y="37" font-size="11" class="mono" fill="#1a1209">main</text>
  </g>
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#dh-ink)">
    <path d="M70 46V66"/>
    <path d="M310 46V66"/>
  </g>

  <!-- HEAD pointing straight at a commit -->
  <rect x="241" y="153" width="62" height="26" rx="6" fill="#1a1209"/>
  <rect x="238" y="150" width="62" height="26" rx="6" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
  <text x="269" y="167" text-anchor="middle" font-size="11" font-weight="800" class="mono" fill="#fff">HEAD</text>
  <path d="M237 164H210" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#dh-ink)"/>
  <text x="318" y="160" font-size="10" font-weight="700" fill="#9a3412">no branch</text>
  <text x="318" y="173" font-size="10" font-weight="700" fill="#9a3412">points here</text>

  <!-- rescue branch -->
  <rect x="134" y="206" width="112" height="24" rx="6" fill="#fff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="190" y="222" text-anchor="middle" font-size="11" font-weight="800" class="mono" fill="#6d28d9">hotfix/banner</text>
  <path d="M133 218H104V164H172" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#dh-pur)"/>

  <!-- steps -->
  <path d="M410 14V222" stroke="#d8d2c8" stroke-width="1.5"/>
  <g font-weight="800" text-anchor="middle" fill="#fff" font-size="12">
    <circle cx="442" cy="44" r="12" fill="#6d28d9"/><text x="442" y="48">1</text>
    <circle cx="442" cy="114" r="12" fill="#6d28d9"/><text x="442" y="118">2</text>
    <circle cx="442" cy="184" r="12" fill="#6d28d9"/><text x="442" y="188">3</text>
  </g>
  <g class="mono" font-size="12" font-weight="700" fill="#1a1209">
    <text x="464" y="40">git checkout v1.0.0</text>
    <text x="464" y="110">git commit -am "..."</text>
    <text x="464" y="180">git branch hotfix/banner bc51973</text>
  </g>
  <g font-size="10" font-weight="600" fill="#5c4a30">
    <text x="464" y="58">HEAD now names a commit, not a branch</text>
    <text x="464" y="128">the new commit hangs off v1.0.0 with no name;</text>
    <text x="464" y="142">switching away leaves it reachable only by reflog</text>
    <text x="464" y="198">a branch now points at it, so it is safe to push</text>
  </g>
</svg>
