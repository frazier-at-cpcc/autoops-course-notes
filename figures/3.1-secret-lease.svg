<svg viewBox="0 0 760 266" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequence of a dynamic database secret: the CI job logs in, Vault creates a database user with a lease, the job renews or revokes the lease, and Vault drops the user">
<defs><marker id="sl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
<marker id="slp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker></defs>
<g text-anchor="middle">
<rect x="52.5" y="10.5" width="120" height="38" rx="7" fill="#1a1209"/><rect x="50" y="8" width="120" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="110" y="25" font-size="12" font-weight="800" fill="#1a1209">CI job</text>
<text x="110" y="38" font-size="9" font-weight="600" fill="#5c4a30">pipeline runner</text>
<rect x="322.5" y="10.5" width="120" height="38" rx="7" fill="#1a1209"/><rect x="320" y="8" width="120" height="38" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="380" y="25" font-size="12" font-weight="800" fill="#fff">Vault</text>
<text x="380" y="38" font-size="9" font-weight="600" fill="#efe6ff">secrets engine db/</text>
<rect x="592.5" y="10.5" width="120" height="38" rx="7" fill="#1a1209"/><rect x="590" y="8" width="120" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="650" y="25" font-size="12" font-weight="800" fill="#1a1209">Postgres</text>
<text x="650" y="38" font-size="9" font-weight="600" fill="#5c4a30">inventory database</text>
</g>
<g stroke="#5c4a30" stroke-width="1.5" stroke-dasharray="4 4">
<path d="M110 48V258"/><path d="M380 48V258"/><path d="M650 48V258"/>
</g>
<rect x="643" y="122" width="14" height="132" rx="3" fill="#ffd60a" stroke="#1a1209" stroke-width="1.5"/>
<text x="664" y="170" font-size="9.5" font-weight="800" fill="#1a1209">user ci-qr7cxiir</text>
<text x="664" y="183" font-size="9" font-weight="600" fill="#5c4a30">exists only while</text>
<text x="664" y="195" font-size="9" font-weight="600" fill="#5c4a30">the lease is alive</text>
<g stroke="#1a1209" stroke-width="2" fill="none">
<path d="M112 64H377" marker-end="url(#sl)"/>
<path d="M378 86H113" marker-end="url(#sl)" stroke-dasharray="5 3"/>
<path d="M112 112H377" marker-end="url(#sl)"/>
<path d="M382 130H641" marker-end="url(#sl)"/>
<path d="M378 152H113" marker-end="url(#sl)" stroke-dasharray="5 3"/>
<path d="M112 180H641" marker-end="url(#sl)"/>
<path d="M112 206H377" marker-end="url(#sl)"/>
<path d="M112 230H377" marker-end="url(#sl)"/>
</g>
<path d="M382 248H641" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#slp)"/>
<g font-size="10" font-weight="700" fill="#1a1209">
<text x="122" y="59">1  Log in with a short-lived OIDC token</text>
<text x="122" y="81" font-weight="600" fill="#5c4a30">Vault token, policy ci-read, TTL 15m</text>
<text x="122" y="107">2  <tspan class="mono">vault read db/creds/ci</tspan></text>
<text x="392" y="125" class="mono" font-size="9.5">CREATE ROLE "ci-qr7cxiir" ... VALID UNTIL</text>
<text x="122" y="147" font-weight="600" fill="#5c4a30">user, password, lease_id, lease 2m</text>
<text x="122" y="175">3  Connect with the generated user and run tests</text>
<text x="122" y="201">4  <tspan class="mono">vault lease renew</tspan><tspan font-weight="600" fill="#5c4a30">  (capped at max_ttl)</tspan></text>
<text x="122" y="225">5  <tspan class="mono">vault lease revoke</tspan><tspan font-weight="600" fill="#5c4a30">  (or TTL expires)</tspan></text>
<text x="392" y="243" class="mono" font-size="9.5" fill="#6d28d9">DROP ROLE "ci-qr7cxiir"</text>
</g>
</svg>
