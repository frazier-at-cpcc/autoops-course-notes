<svg viewBox="0 0 760 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A VPC with public and private subnets in two availability zones, an internet gateway, a NAT gateway, an application load balancer, route tables, and a Route 53 alias record">
<defs><marker id="vp-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
<marker id="vp-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
<marker id="vp-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker></defs>
<!-- VPC -->
<rect x="18.5" y="76.5" width="580" height="250" rx="9" fill="#1a1209"/><rect x="16" y="74" width="580" height="250" rx="9" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="30" y="96" font-size="12" font-weight="800" fill="#3a1d70">VPC <tspan class="mono" font-weight="700">10.20.0.0/16</tspan></text>
<!-- AZ columns -->
<rect x="32" y="104" width="268" height="210" rx="7" fill="none" stroke="#5c4a30" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="312" y="104" width="268" height="210" rx="7" fill="none" stroke="#5c4a30" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="292" y="117" text-anchor="end" font-size="9" font-weight="800" letter-spacing="1.2" fill="#5c4a30">US-EAST-1A</text>
<text x="572" y="117" text-anchor="end" font-size="9" font-weight="800" letter-spacing="1.2" fill="#5c4a30">US-EAST-1B</text>
<!-- subnets -->
<rect x="44" y="124" width="244" height="80" rx="6" fill="#fffae0" stroke="#1a1209" stroke-width="1.5"/>
<text x="54" y="140" font-size="10" font-weight="800" fill="#1a1209">Public <tspan class="mono" font-weight="600" fill="#5c4a30">10.20.0.0/24</tspan></text>
<rect x="324" y="124" width="244" height="80" rx="6" fill="#fffae0" stroke="#1a1209" stroke-width="1.5"/>
<text x="334" y="140" font-size="10" font-weight="800" fill="#1a1209">Public <tspan class="mono" font-weight="600" fill="#5c4a30">10.20.1.0/24</tspan></text>
<rect x="44" y="216" width="244" height="90" rx="6" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="54" y="301" font-size="10" font-weight="800" fill="#1a1209">Private <tspan class="mono" font-weight="600" fill="#5c4a30">10.20.10.0/24</tspan></text>
<rect x="324" y="216" width="244" height="90" rx="6" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="334" y="301" font-size="10" font-weight="800" fill="#1a1209">Private <tspan class="mono" font-weight="600" fill="#5c4a30">10.20.11.0/24</tspan></text>
<!-- internet + igw -->
<g text-anchor="middle">
<rect x="252.5" y="10.5" width="96" height="28" rx="14" fill="#1a1209"/><rect x="250" y="8" width="96" height="28" rx="14" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="298" y="26" font-size="11" font-weight="800" fill="#1a1209">Internet</text>
<rect x="240.5" y="58.5" width="116" height="30" rx="7" fill="#1a1209"/><rect x="238" y="56" width="116" height="30" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="296" y="75" font-size="10.5" font-weight="800" fill="#1a1209">Internet gateway</text>
<!-- NAT -->
<rect x="58.5" y="158.5" width="96" height="36" rx="7" fill="#1a1209"/><rect x="56" y="156" width="96" height="36" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="104" y="171" font-size="10" font-weight="800" fill="#1a1209">NAT gateway</text>
<text x="104" y="184" font-size="8.5" font-weight="600" fill="#5c4a30">+ Elastic IP</text>
<!-- ALB spanning both public subnets -->
<rect x="184.5" y="158.5" width="276" height="36" rx="7" fill="#1a1209"/><rect x="182" y="156" width="276" height="36" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="320" y="171" font-size="10.5" font-weight="800" fill="#fff">Application load balancer</text>
<text x="320" y="184" font-size="8.5" font-weight="700" fill="#efe6ff">HTTPS :443, sg lab-lb, nodes in both AZs</text>
<!-- workloads -->
<rect x="58.5" y="242.5" width="80" height="40" rx="7" fill="#1a1209"/><rect x="56" y="240" width="80" height="40" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="96" y="257" font-size="10" font-weight="800" fill="#1a1209">db</text>
<text x="96" y="271" font-size="8.5" font-weight="600" fill="#5c4a30" class="mono">10.20.10.25</text>
<rect x="178.5" y="242.5" width="92" height="40" rx="7" fill="#1a1209"/><rect x="176" y="240" width="92" height="40" rx="7" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
<text x="222" y="257" font-size="10" font-weight="800" fill="#1a1209">web01</text>
<text x="222" y="271" font-size="8.5" font-weight="600" fill="#5c4a30">sg lab-web</text>
<rect x="412.5" y="242.5" width="92" height="40" rx="7" fill="#1a1209"/><rect x="410" y="240" width="92" height="40" rx="7" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
<text x="456" y="257" font-size="10" font-weight="800" fill="#1a1209">web02</text>
<text x="456" y="271" font-size="8.5" font-weight="600" fill="#5c4a30">sg lab-web</text>
</g>
<!-- inbound path -->
<g stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#vp-pur)">
<path d="M298 36V54"/>
<path d="M310 86V154"/>
<path d="M240 192C240 214 236 220 236 238"/>
<path d="M400 192C404 214 448 216 452 238"/>
</g>
<!-- outbound via NAT -->
<g stroke="#9a3412" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#vp-rust)">
<path d="M200 240C200 218 140 214 128 196"/>
<path d="M152 166H172V104C172 82 204 74 234 72"/>
</g>
<!-- right column: Route 53 and route tables -->
<rect x="614.5" y="10.5" width="130" height="58" rx="7" fill="#1a1209"/><rect x="612" y="8" width="130" height="58" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="624" y="26" font-size="11" font-weight="800" fill="#1a1209">Route 53</text>
<text x="624" y="42" font-size="8.5" font-weight="600" fill="#5c4a30" class="mono">www.lab.example.com</text>
<text x="624" y="56" font-size="8.5" font-weight="600" fill="#5c4a30">A alias to the ALB</text>
<rect x="614.5" y="112.5" width="130" height="50" rx="7" fill="#1a1209"/><rect x="612" y="110" width="130" height="50" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
<text x="622" y="126" font-size="9.5" font-weight="800" fill="#1a1209">Public route table</text>
<text x="622" y="140" font-size="8.5" font-weight="600" fill="#5c4a30" class="mono">10.20.0.0/16 local</text>
<text x="622" y="153" font-size="8.5" font-weight="700" fill="#1a1209" class="mono">0.0.0.0/0 via igw</text>
<rect x="614.5" y="212.5" width="130" height="50" rx="7" fill="#1a1209"/><rect x="612" y="210" width="130" height="50" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="622" y="226" font-size="9.5" font-weight="800" fill="#1a1209">Private route table</text>
<text x="622" y="240" font-size="8.5" font-weight="600" fill="#5c4a30" class="mono">10.20.0.0/16 local</text>
<text x="622" y="253" font-size="8.5" font-weight="700" fill="#1a1209" class="mono">0.0.0.0/0 via nat</text>
<g stroke="#5c4a30" stroke-width="1.2" fill="none" stroke-dasharray="3 3">
<path d="M612 132H570"/>
<path d="M612 234H570"/>
</g>
<!-- legend -->
<g font-size="9" font-weight="600" fill="#5c4a30">
<path d="M20 342H48" stroke="#6d28d9" stroke-width="2" marker-end="url(#vp-pur)"/>
<text x="56" y="345">inbound HTTPS: DNS name, ALB, web servers</text>
<path d="M290 342H318" stroke="#9a3412" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#vp-rust)"/>
<text x="326" y="345">outbound only: private subnets reach the internet through NAT</text>
</g>
</svg>
